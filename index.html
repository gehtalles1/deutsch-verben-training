<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123c35">
<title>德语固定搭配训练场｜Verben mit Präpositionen</title>
<style>
:root{--bg:#f4f6f1;--card:#fff;--ink:#18342e;--muted:#61746e;--green:#176b53;--lime:#d8f36a;--line:#dfe7df;--red:#b84036;--shadow:0 10px 32px #18342e12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
header{background:linear-gradient(125deg,#123c35,#1c6852);color:#fff;padding:24px max(18px,calc((100vw - 1100px)/2));}
header h1{font-size:clamp(24px,4vw,38px);line-height:1.12;margin:0 0 8px;letter-spacing:-.6px}header p{margin:0;color:#d5e9df}
.wrap{max-width:1100px;margin:auto;padding:18px;}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat,.panel,.question,.listbox{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.stat{padding:12px 14px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}.tab,button,select,input{font:inherit}
button,.tab{border:0;border-radius:12px;padding:11px 15px;background:#e6eee7;color:var(--ink);font-weight:700;cursor:pointer}
button.primary,.tab.active{background:var(--green);color:white}button:disabled{opacity:.45;cursor:not-allowed}
.panel{padding:16px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:130px}
label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}select,input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink)}
.question{padding:clamp(18px,4vw,30px);margin-bottom:14px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--green);text-transform:uppercase}
.prompt{font-size:clamp(23px,4vw,34px);font-weight:850;margin:12px 0 8px;overflow-wrap:anywhere}.sub{color:var(--muted);margin:0 0 18px}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.answer{background:#f5f8f4;border:1px solid var(--line);text-align:left;padding:14px;border-radius:12px;min-height:54px}.answer:hover{border-color:var(--green)}.answer.correct{background:#e2f7e9;border-color:#21864f}.answer.wrong{background:#ffebe7;border-color:#c04d42}
.feedback{margin-top:14px;padding:13px;border-radius:12px;background:#f0f4ed;display:none}.feedback.show{display:block}.feedback.good{background:#e2f7e9}.feedback.bad{background:#ffebe7}
.progress{height:8px;background:#e1e8df;border-radius:99px;overflow:hidden;margin:12px 0}.progress div{height:100%;width:0;background:var(--lime);transition:width .2s}
.hidden{display:none!important}.tablewrap{overflow:auto}.listbox{padding:0;overflow:hidden}.item{display:grid;grid-template-columns:1.2fr .9fr .55fr 1.5fr;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line);align-items:center}.item.head{font-size:12px;font-weight:800;color:var(--muted);background:#f6f8f4}.item:last-child{border-bottom:0}.tag{display:inline-block;border-radius:7px;padding:2px 7px;background:#e7efe8;font-size:12px;font-weight:800}
footer{color:var(--muted);font-size:12px;text-align:center;padding:20px}
@media(max-width:650px){.wrap{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.answers{grid-template-columns:1fr}.item{grid-template-columns:1fr .8fr .5fr}.item .meaning{grid-column:1/-1;color:var(--muted);padding-top:0}.item.head .meaning{display:none}.row>*{min-width:100px}header{padding:22px 18px}}
</style></head>
<body>
<header><h1>德语固定搭配训练场</h1><p>Verben mit Präpositionen · 动词 + 介词 + 格 · 手机/电脑自适应</p></header>
<main class="wrap">
<div class="stats">
 <div class="stat"><b id="total">290</b><span>搭配条目</span></div>
 <div class="stat"><b id="done">0</b><span>本轮已答</span></div>
 <div class="stat"><b id="accuracy">—</b><span>本轮正确率</span></div>
 <div class="stat"><b id="mastered">0</b><span>累计答对次数</span></div>
</div>
<div class="tabs">
 <button class="tab active" data-mode="choice">搭配选择</button><button class="tab" data-mode="example">例句练习</button><button class="tab" data-mode="flash">闪卡复习</button><button class="tab" data-mode="library">搭配词库</button>
</div>
<section class="panel" id="settings">
 <div class="row">
  <div id="directionWrap"><label for="direction">考查方向</label><select id="direction"><option value="zh">中文意思 → 德语搭配</option><option value="verb">动词 → 介词</option><option value="prep">介词 → 动词搭配</option></select></div>
  <div><label for="caseFilter">格筛选</label><select id="caseFilter"><option value="all">全部格</option><option value="A">Akkusativ（第四格）</option><option value="D">Dativ（第三格）</option><option value="N">Nominativ（第一格）</option></select></div>
  <div><label for="count">每轮题量</label><select id="count"><option>10</option><option>20</option><option selected>30</option><option>50</option><option>100</option><option value="all">全部</option></select></div>
  <div><label for="search">快速搜索词库</label><input id="search" placeholder="如 freuen / auf / 期待"></div>
 </div>
</section>
<section id="quiz">
 <div class="question">
  <div class="eyebrow" id="modeLabel">选择练习 · 第 1 题</div><div class="progress"><div id="bar"></div></div>
  <div class="prompt" id="prompt">准备开始</div><p class="sub" id="hint">选择正确的固定搭配。</p>
  <div id="answers" class="answers"></div>
  
  <div id="feedback" class="feedback" aria-live="polite"></div>
  <div class="row" style="margin-top:16px"><button id="skip">跳过</button><button id="next" class="primary" disabled>下一题 →</button><button id="restart">重新开始</button></div>
 </div>
</section>
<section id="flash" class="hidden"><div class="question"><div class="eyebrow">闪卡复习</div><div class="prompt" id="flashPrompt"></div><p class="sub" id="flashAnswer" class="hidden"></p><button class="primary" id="reveal">显示答案</button> <button id="flashNext">下一张 →</button></div></section>
<section id="library" class="hidden">
 <div class="panel"><div class="row"><div><label>筛选搭配</label><input id="librarySearch" placeholder="输入动词、介词或中文意思"></div><div><label>按格筛选</label><select id="libraryCase"><option value="all">全部格</option><option value="A">Akkusativ（第四格）</option><option value="D">Dativ（第三格）</option><option value="N">Nominativ（第一格）</option></select></div></div><p id="libraryCount"></p></div>
 <div class="listbox tablewrap"><div class="item head"><div>动词/结构</div><div>介词</div><div>格</div><div class="meaning">中文提示</div></div><div id="libraryRows"></div></div>
</section>
<footer>离线可用 · 无需后端 · GitHub Pages 直接部署 · 学习进度保存在当前浏览器</footer>
</main>
